name: Daily Guangming Push via ntfy

on:
  schedule:
    # UTC 时间，北京时间早上 8 点 = UTC 0 点
    # 避开整点，用 17 分这类非整点分钟更稳
    - cron: '17 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run crawler
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python daily_gmw.py
